name: Build Assets

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install Composer dependencies
        run: |
          composer config http-basic.composer.fluxui.dev \
            "${{ secrets.FLUX_USERNAME }}" \
            "${{ secrets.FLUX_LICENSE_KEY }}"

          composer install \
            --no-interaction \
            --prefer-dist \
            --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Commit built assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f public/build

          if git diff --cached --quiet; then
            echo "No asset changes."
          else
            git commit -m "Build frontend assets"
            git push
          fi
