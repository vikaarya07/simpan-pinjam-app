name: Deploy Laravel Simpan Pinjam

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, bcmath, ctype, curl, dom, fileinfo, openssl, pdo, pdo_mysql, tokenizer, xml
          tools: composer:v2
          coverage: none

      - name: Configure Flux credentials
        run: |
          composer config http-basic.composer.fluxui.dev \
            "${{ secrets.FLUX_USERNAME }}" \
            "${{ secrets.FLUX_LICENSE_KEY }}"

      - name: Install Composer dependencies
        run: |
          composer install \
            --no-interaction \
            --prefer-dist \
            --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy files via rsync
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }}" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='vendor/' \
            --exclude='tests/' \
            --exclude='storage/logs/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='phpunit.xml' \
            --exclude='README.md' \
            ./ \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/home/u426348873/domains/vikaarya07.my.id/public_html/simpan-pinjam/"

      - name: Finalize Laravel deployment
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            'bash -s' << 'REMOTE_SCRIPT'

          set -e

          PROJECT_PATH="/home/u426348873/domains/vikaarya07.my.id/public_html/simpan-pinjam"
          PHP="/opt/alt/php84/usr/bin/php"
          COMPOSER="/usr/local/bin/composer"

          cd "$PROJECT_PATH"

          echo "========================================"
          echo "PHP VERSION"
          echo "========================================"
          "$PHP" -v

          echo "========================================"
          echo "INSTALLING PRODUCTION DEPENDENCIES"
          echo "========================================"

          "$PHP" "$COMPOSER" install \
            --no-dev \
            --no-interaction \
            --prefer-dist \
            --optimize-autoloader

          echo "========================================"
          echo "RECREATING STORAGE LINK"
          echo "========================================"

          if [ -L public/storage ]; then
              rm public/storage
          elif [ -e public/storage ]; then
              rm -rf public/storage
          fi

          "$PHP" artisan storage:link

          echo "========================================"
          echo "RUNNING DATABASE MIGRATIONS"
          echo "========================================"

          "$PHP" artisan migrate --force

          echo "========================================"
          echo "CLEARING CACHE"
          echo "========================================"

          "$PHP" artisan optimize:clear

          echo "========================================"
          echo "OPTIMIZING LARAVEL"
          echo "========================================"

          "$PHP" artisan optimize

          echo "========================================"
          echo "LARAVEL VERSION"
          echo "========================================"

          "$PHP" artisan --version

          echo "========================================"
          echo "DEPLOYMENT COMPLETED"
          echo "========================================"

          REMOTE_SCRIPT
