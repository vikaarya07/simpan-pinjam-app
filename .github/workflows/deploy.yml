name: Deploy Simpan Pinjam

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, bcmath, ctype, curl, dom, fileinfo, openssl, pdo, pdo_mysql, tokenizer, xml
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Prepare deployment package
        run: |
          mkdir deploy

          rsync -a \
            --exclude=".git" \
            --exclude=".github" \
            --exclude=".env" \
            --exclude=".env.*" \
            --exclude="node_modules" \
            --exclude="storage/logs/*" \
            --exclude="storage/framework/cache/*" \
            --exclude="storage/framework/sessions/*" \
            --exclude="storage/framework/views/*" \
            ./ deploy/

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_KEY }}

      - name: Add Hostinger to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.HOSTINGER_PORT }}" "${{ secrets.HOSTINGER_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy files
        run: |
          rsync -az --delete \
            --exclude=".env" \
            --exclude="storage/" \
            -e "ssh -p ${{ secrets.HOSTINGER_PORT }}" \
            deploy/ \
            "${{ secrets.HOSTINGER_USERNAME }}@${{ secrets.HOSTINGER_HOST }}:/home/u426348873/domains/vikaarya07.my.id/public_html/simpan-pinjam/"

      - name: Run Laravel deployment commands
        run: |
          ssh -p "${{ secrets.HOSTINGER_PORT }}" \
            "${{ secrets.HOSTINGER_USERNAME }}@${{ secrets.HOSTINGER_HOST }}" << 'EOF'

          cd /home/u426348873/domains/vikaarya07.my.id/public_html/simpan-pinjam

          /opt/alt/php84/usr/bin/php artisan storage:link || true

          /opt/alt/php84/usr/bin/php artisan migrate --force

          /opt/alt/php84/usr/bin/php artisan optimize:clear

          /opt/alt/php84/usr/bin/php artisan config:cache

          /opt/alt/php84/usr/bin/php artisan route:cache

          /opt/alt/php84/usr/bin/php artisan view:cache

          EOF
