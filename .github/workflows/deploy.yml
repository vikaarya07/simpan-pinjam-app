name: Deploy Simpan Pinjam

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------
      # Checkout
      # ----------------------------------------
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      # ----------------------------------------
      # PHP
      # ----------------------------------------
      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2
        with:
          php-version: "8.4"
          tools: composer:v2

      # ----------------------------------------
      # Node.js
      # ----------------------------------------
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: npm

      # ----------------------------------------
      # Flux credentials
      # ----------------------------------------
      - name: Configure Flux credentials
        run: |
          composer config http-basic.composer.fluxui.dev \
            "${{ secrets.FLUX_USERNAME }}" \
            "${{ secrets.FLUX_LICENSE_KEY }}"

      # ----------------------------------------
      # PHP dependencies
      # ----------------------------------------
      - name: Install Composer dependencies
        run: |
          composer install \
            --no-dev \
            --no-interaction \
            --prefer-dist \
            --optimize-autoloader

      # ----------------------------------------
      # Node dependencies
      # ----------------------------------------
      - name: Install Node dependencies
        run: npm install

      # ----------------------------------------
      # Build Vite
      # ----------------------------------------
      - name: Build assets
        run: npm run build

      # ----------------------------------------
      # Verify build
      # ----------------------------------------
      - name: Verify Vite build
        run: |
          test -f public/build/manifest.json
          echo "Vite build berhasil."
          ls -lah public/build

      # ----------------------------------------
      # Prepare SSH
      # ----------------------------------------
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' '${{ secrets.SSH_PRIVATE_KEY }}' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan \
            -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_HOST }}" \
            >> ~/.ssh/known_hosts

      # ----------------------------------------
      # Update Laravel source on server
      # ----------------------------------------
      - name: Update application
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            'cd /home/u426348873/domains/vikaarya07.my.id/public_html/simpan-pinjam && git fetch origin main && git reset --hard origin/main'

      # ----------------------------------------
      # Upload Vite build
      # ----------------------------------------
      - name: Upload Vite build
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            'mkdir -p /home/u426348873/domains/vikaarya07.my.id/public_html/simpan-pinjam/public/build'

          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=yes" \
            public/build/ \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/home/u426348873/domains/vikaarya07.my.id/public_html/simpan-pinjam/public/build/"

      # ----------------------------------------
      # Laravel production commands
      # ----------------------------------------
      - name: Optimize Laravel
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            'cd /home/u426348873/domains/vikaarya07.my.id/public_html/simpan-pinjam && \
             /opt/alt/php84/usr/bin/php artisan migrate --force && \
             /opt/alt/php84/usr/bin/php artisan storage:link || true'

      - name: Clear and cache Laravel
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            'cd /home/u426348873/domains/vikaarya07.my.id/public_html/simpan-pinjam && \
             /opt/alt/php84/usr/bin/php artisan optimize:clear && \
             /opt/alt/php84/usr/bin/php artisan config:cache && \
             /opt/alt/php84/usr/bin/php artisan route:cache && \
             /opt/alt/php84/usr/bin/php artisan view:cache'

      # ----------------------------------------
      # Finished
      # ----------------------------------------
      - name: Deployment completed
        run: echo "Deployment Simpan Pinjam berhasil."
